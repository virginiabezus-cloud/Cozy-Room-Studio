<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozy Interior Design Challenge</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-container">
    <h1 class="game-title">Cozy Room Studio</h1>

    <!-- PANTALLA DE SELECCIÓN DE NIVEL Y MODO -->
    <div id="setup-screen" class="cozy-card">
      <h2>Selecciona tu Desafío</h2>

      <p class="section-label">Modo de Juego:</p>
      <div class="mode-selector">
        <div class="mode-card selected" data-mode="writing">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 20l4-1 10-10-3-3L5 16l-1 4z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
            <path d="M14 7l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span>Writing</span>
        </div>
        <div class="mode-card" data-mode="listening">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 13v-1a8 8 0 0116 0v1" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
            <rect x="2" y="13" width="5" height="7" rx="2" fill="currentColor"/>
            <rect x="17" y="13" width="5" height="7" rx="2" fill="currentColor"/>
          </svg>
          <span>Listening</span>
        </div>
      </div>

      <p class="section-label">Nivel de Dificultad:</p>
      <div class="level-selector">
        <div class="level-card selected" data-level="1">
          <span class="stars">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z"/></svg>
          </span>
          <span>Nivel 1</span>
        </div>
        <div class="level-card" data-level="2">
          <span class="stars">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z"/></svg>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z"/></svg>
          </span>
          <span>Nivel 2</span>
        </div>
        <div class="level-card" data-level="3">
          <span class="stars">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z"/></svg>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z"/></svg>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z"/></svg>
          </span>
          <span>Nivel 3</span>
        </div>
      </div>

      <!-- BOTÓN GRÁFICO PARA INICIAR -->
      <div id="start-btn" class="img-button">
        <span>¡COMENZAR!</span>
      </div>
    </div>

    <!-- PANTALLA PRINCIPAL DEL JUEGO -->
    <div id="game-screen" class="hidden">
      <div id="status-message" class="status-badge">Cargando modelo de IA...</div>

      <!-- Botón para volver al menú de selección -->
      <div id="back-btn" class="back-icon-btn" title="Volver al menú">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M19 12H5M5 12l6-6M5 12l6 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Menú
      </div>

      <!-- Explicación del concepto de inglés que se practica en este nivel -->
      <div id="concept-card" class="concept-card">
        <svg class="concept-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 5.5C4 4.7 4.7 4 5.5 4H12v16H5.5C4.7 20 4 19.3 4 18.5v-13z" fill="currentColor" opacity="0.85"/>
          <path d="M20 5.5C20 4.7 19.3 4 18.5 4H12v16h6.5c.8 0 1.5-.7 1.5-1.5v-13z" fill="currentColor" opacity="0.6"/>
        </svg>
        <div class="concept-text">
          <strong id="concept-title"></strong>
          <p id="concept-body"></p>
        </div>
      </div>

      <div class="main-stage">
        <!-- Estantería gráfica de muebles -->
        <div id="inventory" class="cozy-shelf">
          <h3>Muebles</h3>
          <div id="furniture-list"></div>
        </div>

        <!-- Escenario de la Habitación -->
        <div id="room" class="cozy-room"></div>
      </div>

      <!-- CONTROLES MEDIANTE IMÁGENES / ÍCONOS -->
      <div id="controls-panel" class="cozy-card controls-card">

        <!-- Control de Audio (Listening) -->
        <div id="listening-controls" class="hidden">
          <div id="play-audio-btn" class="audio-icon-btn" title="Escuchar Instrucción">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/>
              <path d="M16.5 8.5c1.5 1.5 1.5 5.5 0 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
              <path d="M19 6c3 3 3 9 0 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
            </svg>
            Escuchar
          </div>
        </div>

        <!-- Control de Texto (Writing) -->
        <div id="writing-controls" class="hidden">
          <input type="text" id="user-input" placeholder="Type your sentence in English...">
          <div id="submit-btn" class="send-icon-btn" title="Enviar Orden">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 12h17M14 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Enviar
          </div>
        </div>

        <div id="feedback" class="feedback-badge"></div>
      </div>

      <!-- Pantalla de "Nivel completado" / felicitaciones finales -->
      <div id="level-complete-overlay" class="overlay hidden">
        <div class="overlay-card">
          <div class="overlay-star-deco" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z"/></svg>
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z"/></svg>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z"/></svg>
          </div>
          <svg class="overlay-trophy" width="56" height="56" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 4h10v4a5 5 0 01-10 0V4z" fill="currentColor"/>
            <path d="M7 5H4a3 3 0 003 3M17 5h3a3 3 0 01-3 3" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>
            <path d="M12 13v4M9 20h6M10 17h4v3h-4z" fill="currentColor"/>
          </svg>
          <h2 id="overlay-title">¡Nivel completado!</h2>
          <p id="overlay-body">Estás listo para el siguiente desafío.</p>
          <div id="overlay-action-btn" class="img-button overlay-btn"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
    window.pipeline = pipeline;
  </script>
  <script src="script.js"></script>
</body>
</html>

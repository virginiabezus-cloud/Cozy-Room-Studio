<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozy Grammar Room</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="game-header">
    <h1>Cozy Grammar Room</h1>
    <div class="header-buttons">
      <button id="theme-toggle-btn" class="icon-btn" type="button">
        <img id="theme-icon" src="assets/luna.png" alt="Theme" width="24" height="24">
      </button>
      <button id="settings-btn" class="icon-btn" type="button">
        <img src="assets/configurador.png" alt="Settings" width="24" height="24">
      </button>
    </div>
  </header>

  <!-- Setup Screen -->
  <main id="setup-screen" class="screen-container">
    <div class="setup-layout">
      <aside class="mascot-sidebar">
        <div id="menu-mascot" class="mascot-avatar"></div>
        <div class="dialog-bubble">
          <p id="menu-mascot-dialog">Pick a level and decorate with me!</p>
        </div>
      </aside>

        <section class="options-panel">
          <div class="option-group">
            <label>GAME MODE</label>
            <div class="btn-group">
              <button class="mode-btn selected" data-mode="writing" type="button">
                 <img src="assets/Lapiz.png" class="btn-icon" alt="Writing" width="20" height="20"> Writing
              </button>
              <button class="mode-btn" data-mode="listening" type="button">
                 <img src="assets/volumen.png" class="btn-icon" alt="Listening" width="20" height="20"> Listening
              </button>
            </div>
          </div>

            <div class="option-group">
              <label>DIFFICULTY</label>
              <div class="btn-group">
                <button class="diff-btn selected" data-diff="easy" type="button">EASY</button>
                <button class="diff-btn" data-diff="normal" type="button">NORMAL</button>
                <button class="diff-btn" data-diff="hard" type="button">HARD</button>
              </div>
            </div>

            <div class="option-group">
              <label>SELECT LEVEL</label>
              <div id="level-grid" class="level-grid"></div>
            </div>

        <button id="prepare-btn" class="action-btn" type="button">PLAY LEVEL</button>
      </section>
    </div>
  </main>

  <!-- Game Screen -->
  <main id="game-screen" class="screen-container hidden">

    <div class="game-top-bar">
      <button id="back-btn" class="icon-btn" type="button">
        <img src="assets/flecha_iz.png" alt="Back" width="24" height="24">
      </button>
      <span id="status-badge" class="badge">Level 1</span>
      <span id="diff-badge" class="badge">EASY</span>
    </div>

    <div class="game-layout">
      <aside class="furniture-sidebar">
        <h3>Furniture</h3>
        <div id="furniture-list" class="furniture-list"></div>
      </aside>

      <section class="room-container">
        <div id="room" class="cozy-room"></div>
        <div class="room-mascot-container">
           <div id="game-mascot-dialog" class="dialog-bubble small-dialog">Ready to play!</div>
           <div id="game-mascot-sprite" class="mascot-avatar"></div>
        </div>
      </section>
    </div>

    <div id="writing-controls" class="controls-bar">
      <input type="text" id="user-input" placeholder="e.g. Place the rug under the table">
      <button id="submit-btn" class="action-btn" type="button">Submit</button>
    </div>

    <div id="listening-controls" class="controls-bar hidden">
      <button id="play-audio-btn" class="action-btn" type="button">
        <img src="assets/volumen.png" class="btn-icon" alt="Audio" width="20" height="20"> Listen Command
      </button>
    </div>
  </main>

  <!-- Pre-Level Modal -->
  <div id="loading-screen" class="modal hidden">
    <div id="level-info-preview" class="modal-content">
      <h2 id="loading-title">Level 1</h2>
      <p>Prepositions to Master:</p>
      <p id="level-preps-list" class="highlight-text"></p>
      <button id="start-level-btn" class="action-btn" type="button">START GAME</button>
    </div>
  </div>

  <!-- Win Modal -->
  <div id="level-complete-overlay" class="modal hidden">
    <div class="modal-content">
      <div id="win-mascot" class="mascot-avatar large"></div>
      <h2>Level Cleared! 🎉</h2>
      <button id="overlay-action-btn" class="action-btn" type="button">Next Level</button>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-content settings-content">
      <h2>Game Settings</h2>
      <h3>Choose Mascot:</h3>
      <div class="mascot-selection">
         <button class="mascot-opt selected" data-mascot="bunny" type="button">
           <img src="assets/bunny.png" alt="Bunny" width="50" height="50">
           <span>Bunny</span>
         </button>
         <button class="mascot-opt" data-mascot="cat" type="button">
           <img src="assets/cat.png" alt="Cat" width="50" height="50">
           <span>Cat</span>
         </button>
         <button class="mascot-opt" data-mascot="bear" type="button">
           <img src="assets/bear.png" alt="Bear" width="50" height="50">
           <span>Bear</span>
         </button>
      </div>
      <button id="reset-progress-btn" class="danger-btn" type="button">Reset Game Progress</button>
      <button id="close-settings-btn" class="action-btn secondary" type="button">Close</button>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
